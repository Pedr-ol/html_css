<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formularios</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <h2>Formularios HTML</h2>
    <!-- PRIMEIRO FORMULARIO -->
    <!-- Atributos do formulário -->
    <form action="register.php" method="GET">
        <div>
            <label>Nome:</label>
            <input type="text" />
        </div>
        <!-- Atributo name -->
        <div>
            <!-- Atributo label -->
            <label for="age">Idade:</label>
            <input type="text" name="age" />
        </div>
        <!-- Select -->
        <div>
            <label for="job">Selecione a sua profissão:</label>
            <select name="job">
                <option value="programador">Programador</option>
                <option value="tester">Tester/QA</option>
                <option value="devops">DevOps</option>
            </select>
        </div>
        <!-- Atributo Selected -->
        <div>
            <label for="contract">Você leu os termos do contrato?</label>
            <select name="contract">
                <option value="sim">Sim</option>
                <option value="não" selected>Não</option>
            </select>
        </div>
        <!-- Multiplas opções -->
        <div>
            <label for="items">Selecione os itens:</label>
            <select name="items" multiple>
                <option value="banana">banana</option>
                <option value="arroz">Arroz</option>
                <option value="feijão">Feijão</option>
                <option value="maçã">Maçã</option>
            </select>
        </div>
        <!-- Textarea -->
        <div>
            <label for="comment">Escreva abaixo o que você achou do post:</label>
            <textarea name="comment"></textarea>
        </div>
        <!-- Fieldset e legend -->
        <div>
            <fieldset>
                <legend>Preencha as suas informações:</legend>
                <label for="firstname">Nome:</label>
                <input type="text" name="firstname">
                <label for="lastname">Sobrenome:</label>
                <input type="text" name="lastname">
            </fieldset>
        </div>
        <!-- Datalist -->
        <div>
            <label for="flavor">Escolha o sabor:</label>
            <input type="text" list="flavors" name="flavor">
            <datalist id="flavors">
                <option value="Morango"></option>
                <option value="Chocolate"></option>
                <option value="Limão"></option>
                <option value="Flocos"></option>
                <option value="Chiclete com banana"></option>
            </datalist>
        </div>
        <!-- Senha -->
        <div>
            <label for="password">Digite a sua senha:</label>
            <input type="password" name="password">
        </div>
        <!-- Radio button -->
        <div>
            <label for="car_model">Escolha o modelo do seu carro:</label>
            <div class="radio">
                <input type="radio" value="bmw" name="car_model">
                <label for="bmw">BMW</label>
                <input type="radio" value="volvo" name="car-model">
                <label for="volvo">VOLVO</label>
                <input type="radio" value="byd" name="car-model">
                <label for="byd">BYD</label>
            </div>
        </div>
        <!-- Checkbox -->
        <div>
            <label for="optionals">Opcionais do carro:</label>
            <div class="radio">
                <input type="checkbox" name="optionals[]" value="big_tires">
                <label for="big_tires">Pneus Grandes</label>
            </div>
            <div class="radio">
                <input type="checkbox" name="optionals[]" value="tubo_engine">
                <label for="tubo_engine">Motor turbo</label>
            </div>
            <div class="radio">
                <input type="checkbox" name="optionals[]" value="hybrid">
                <label for="hybrid">Hibrido</label>
            </div>
        </div>
        <!-- Datas -->
        <div>
            <label for="birthday">Data de nascimento:</label>
            <input type="date" name="birthday">
        </div>
        <!-- Arquivos -->
        <div>
            <label for="image">Insira a sua imagem:</label>
            <input type="file" name="image">
        </div>
        <!-- Numeros -->
        <div>
            <label for="salary">Quanto você ganha no seu emprego:</label>
            <input type="number" name="salary">
        </div>
        <!-- E-mails -->
        <div>
            <label for="email">Digite o seu email:</label>
            <input type="email" name="email">
        </div>
        <!-- Value -->
        <div>
            <label for="value">Digite algum valor</label>
            <input type="text" value="O meu valor é este: 2">
        </div>
        <!-- Disabled -->
        <div>
            <p>Tente mudar o valor</p>
            <input type="text" value="Não precisa preencher" disabled>
        </div>
        <!-- Placeholder -->
        <div>
            <label for="currentjob">Digite sua profissão:</label>
            <input type="text" name="currentjob" placeholder="Atualmente no que você trabalha?">
        </div>
        <!-- Required -->
        <div>
            <label for="birthyear">Ano nascimento:</label>
            <input type="text" placeholder="Digite o ano do seu nascimento" required>
        </div>
        <!-- Resetar form -->
        <input type="reset" value="Limpar">
        <!--  Envio de form  -->
        <input type="submit" value="Enviar" />

    </form>
</body>

</html>
